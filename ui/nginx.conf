server {
  listen 80;
  server_name _;

  # seus arquivos estáticos
  root /usr/share/nginx/html;
  index index.html;

  # proxy para API
  location /api/ {
    proxy_pass http://api:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
