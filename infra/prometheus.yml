global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "ping"
    metrics_path: /probe
    params:
      module: [icmp]          # usa o módulo icmp do blackbox
    file_sd_configs:
      - files: ["/etc/prometheus/targets.yml"]
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]   # alvo do file_sd vem como "host:port"
        target_label: __param_target   # passa como ?target=...
      - source_labels: [__param_target]
        target_label: instance         # rótulo bonitinho p/ o Grafana
      - target_label: __address__
        replacement: blackbox:9115     # onde está o blackbox exporter

