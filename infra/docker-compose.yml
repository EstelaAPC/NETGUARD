services:
  db:
    image: timescale/timescaledb:2.14.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: netguard
      POSTGRES_PASSWORD: netguard
      POSTGRES_DB: netguard
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U netguard -d netguard || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: ../api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://netguard:netguard@db:5432/netguard
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  poller:
    build: ../poller
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://netguard:netguard@db:5432/netguard
      # ajuste se teu poller usar outras vars (ex.: POLL_INTERVAL etc.)
    depends_on:
      db:
        condition: service_healthy

  ui:
    # opção simples: servir estático via nginx do diretório ../ui
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    volumes:
      - ../ui:/usr/share/nginx/html:ro
    ports:
      - "3100:80"

  grafana:
    image: grafana/grafana:11.1.3
    restart: unless-stopped
    environment:
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # se estiver com SELinux Enforcing e bind-mounts, preferir volumes nomeados (como abaixo)
    depends_on:
      db:
        condition: service_started
    ports:
      - "3000:3000"
    volumes:
      - grafdata:/var/lib/grafana

volumes:
  dbdata:
  grafdata:
